[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "simpsons-face-recognition"
version = "0.0.1"
description = "a ML project to train an EfficientNetB0 model and custom TensorFlow model to classify Simpsons characters"
authors = [
  { name = "amy sun" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["simpsons-face-recognition"]
include = ["pyproject.toml", "simpsons-face-recognition/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["simpsons-face-recognition"]
force-sort-within-sections = true

